[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects — legacy paths from any previous personal site go here (see docs/DEPLOYMENT.md §Redirects).
[[redirects]]
  from = "/blog"
  to = "/perspectives"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/perspectives/:splat"
  status = 301
[[redirects]]
  from = "/about"
  to = "/story"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/connect"
  status = 301
[[redirects]]
  from = "/career"
  to = "/global-career"
  status = 301
[[redirects]]
  from = "/bizandstyle"
  to = "/biz-and-style"
  status = 301
[[redirects]]
  from = "/feed"
  to = "/perspectives/rss.xml"
  status = 301
[[redirects]]
  from = "/rss.xml"
  to = "/perspectives/rss.xml"
  status = 301

# Long-lived caching for hashed assets; HTML stays revalidated.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://region1.google-analytics.com https://challenges.cloudflare.com https://api.netlify.com https://identity.netlify.com; frame-src https://www.googletagmanager.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self' https://unpkg.com https://identity.netlify.com https://api.netlify.com https://*.netlify.app data: blob: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; frame-ancestors 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
